<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova Solutions - Login</title>
    <!-- SOLO UN CSS para login -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-icon">🚀</div>
                <h1>TechNova <span>Solutions</span></h1>
                <p>Inicia sesión para acceder al sistema</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">📧 Correo Electrónico</label>
                    <div class="input-group">
                    
                        <input type="email" id="email" placeholder="ejemplo@tecnova.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">🔒 Contraseña</label>
                    <div class="input-group">
           
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">🚀 Ingresar</button>
            </form>
            <div id="loginError" class="error-message"></div>
            <div class="login-footer">
                <p>👥 Usuarios de prueba:</p>
                <div class="user-info">
                    <span class="user-badge">yare_ph@tecnova.com</span>
                    <span class="user-badge">mary_vc@tecnova.com</span>
                </div>
                <p style="margin-top: 10px; font-size: 12px; color: #999;">Contraseña: 123456</p>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>

</html>
